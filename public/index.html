<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GAM — Global Admin Account System</title>
<style>
  :root {
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --radius: 10px;
  }
  /* ---- ember theme, matched to the real Interstellar Console UI —
     colors sampled directly from screenshots, not guessed. Console's
     own look leans on the accent color + spacing for definition rather
     than high-contrast borders (its real border-vs-surface ratio is
     only ~1.3:1), so this intentionally follows that over abstract
     contrast targets. ---- */
  html, [data-theme="ember"] {
    --bg: #0b0e11; --bg-alt: #12161b; --surface: #12161b; --surface-2: #181d24;
    --border: #252b34; --border-soft: #1c212a;
    --text: #e8e6e1; --text-dim: #818996; --text-faint: #4f5561;
    --accent: #ff8a3d; --accent-dim: #d8701f; --accent-glow: rgba(255,138,61,0.20);
    --green: #45bf9f; --red: #e2585f; --yellow: #e0b84c; --blue: #5b9dd9;
  }
  [data-theme="ocean"] {
    --bg: #070f18; --bg-alt: #0f1c2c; --surface: #142438; --surface-2: #1a2d44;
    --border: #5a8abd; --border-soft: #35547d;
    --text: #f1f7fd; --text-dim: #b7c9dd; --text-faint: #7e93ac;
    --accent: #5fc4f5; --accent-dim: #43a2cc; --accent-glow: rgba(95,196,245,0.22);
    --green: #7fdcb8; --red: #f07871; --yellow: #eec35c; --blue: #83b8e6;
  }
  [data-theme="forest"] {
    --bg: #0a1209; --bg-alt: #13200f; --surface: #182818; --surface-2: #203420;
    --border: #63925d; --border-soft: #3d5c3a;
    --text: #f3f9f0; --text-dim: #bcd4bb; --text-faint: #839a80;
    --accent: #7fe08b; --accent-dim: #5fbf6b; --accent-glow: rgba(127,224,139,0.22);
    --green: #8ed68e; --red: #f07871; --yellow: #eec35c; --blue: #83b8e6;
  }
  [data-theme="light"] {
    --bg: #eeebe4; --bg-alt: #ffffff; --surface: #ffffff; --surface-2: #f2ede4;
    --border: #9d8e73; --border-soft: #c9bfae;
    --text: #16110c; --text-dim: #4c443a; --text-faint: #756a5c;
    --accent: #d4661f; --accent-dim: #b4551a; --accent-glow: rgba(212,102,31,0.16);
    --green: #327140; --red: #b33a32; --yellow: #93690a; --blue: #285d87;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); transition: background .2s, color .2s; }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  a { color: var(--accent); }
  ::selection { background: var(--accent-glow); }

  /* ---- scrollbars, everywhere (documents and any overflow:auto panel) ---- */
  * { scrollbar-width: thin; scrollbar-color: var(--border) var(--bg-alt); }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: var(--bg-alt); }
  ::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 20px; border: 2px solid var(--bg-alt); }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--accent-dim); }
  ::-webkit-scrollbar-corner { background: var(--bg-alt); }

  /* ---- brand mark ---- */
  .brandmark { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: 0.01em; font-size: 16px; }
  .brandmark .logo { width: 26px; height: 26px; flex-shrink: 0; }
  .brandmark .dot { fill: var(--accent); }
  .brandmark .ring { stroke: var(--text-dim); }
  .brandmark .word span { color: var(--accent); }

  /* ---- login ---- */
  .center-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; overflow: hidden; }
  .center-screen::before {
    content: ''; position: absolute; inset: -20%; z-index: 0; pointer-events: none;
    background: radial-gradient(circle at 30% 20%, var(--accent-glow), transparent 55%),
                radial-gradient(circle at 80% 80%, var(--accent-glow), transparent 45%);
    opacity: .8;
  }
  .card { position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 34px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
  .card .brandmark { justify-content: center; margin-bottom: 6px; font-size: 20px; }
  .card .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; text-align: center; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin: 14px 0 6px; letter-spacing: .01em; }
  input, select, textarea { width: 100%; background: var(--bg-alt); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 10px 11px; font-size: 14px; font-family: var(--sans); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-dim); box-shadow: 0 0 0 3px var(--accent-glow); }
  button { cursor: pointer; border: none; border-radius: 7px; padding: 9px 15px; font-size: 13px; font-weight: 600; font-family: var(--sans); transition: transform .08s, background .15s, border-color .15s, color .15s; }
  button:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #1a1008; }
  [data-theme="light"] .btn-primary { color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-faint); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); opacity: .85; }
  .btn-danger:hover { opacity: 1; background: rgba(229,103,95,0.08); }
  .btn-block { width: 100%; margin-top: 20px; padding: 11px; font-size: 14px; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .err { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 16px; }
  .hint { color: var(--text-faint); font-size: 12px; margin-top: 4px; line-height: 1.5; }

  /* ---- shell ---- */
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border-soft); background: var(--bg-alt); }
  header .who { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-dim); }
  .avatar-chip { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: var(--accent); flex-shrink: 0; }
  .role-pill { font-size: 10px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
  .role-pill.systemAdministrator { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-glow); }
  .role-pill.trustedInstaller { color: var(--blue); border-color: var(--blue); }

  main { flex: 1; display: flex; }
  nav { width: 208px; border-right: 1px solid var(--border-soft); padding: 18px 12px; background: var(--bg-alt); }
  nav .navlabel { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); padding: 4px 12px 8px; }
  nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; color: var(--text-dim); padding: 9px 12px; border-radius: 8px; font-weight: 600; margin-bottom: 2px; font-size: 13px; }
  nav button svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .8; }
  nav button:hover { background: var(--surface-2); color: var(--text); }
  nav button.active { background: var(--accent-glow); color: var(--accent); }
  nav button.active svg { opacity: 1; }
  section.content { flex: 1; padding: 30px 34px; max-width: 920px; animation: fadein .18s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  h2 { font-size: 19px; margin: 0 0 4px; display: flex; align-items: center; gap: 9px; }
  .pagesub { color: var(--text-faint); font-size: 13px; margin-bottom: 22px; }

  /* ---- stat cards ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat-card .num { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1.1; }
  .stat-card .label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px; }
  .panel h3 { margin: 0 0 14px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .panel h3 svg { width: 15px; height: 15px; color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  th { color: var(--text-faint); font-weight: 600; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-2); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--border); color: var(--text-dim); display: inline-block; }
  .badge.systemAdministrator { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-glow); }
  .badge.trustedInstaller { color: var(--blue); border-color: var(--blue); }
  .badge.disabled { color: var(--red); border-color: var(--red); }
  .badge.ok { color: var(--green); border-color: var(--green); }
  .badge.warn { color: var(--yellow); border-color: var(--yellow); }
  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .name-cell { display: flex; align-items: center; gap: 10px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
  .toolbar input[type=text] { max-width: 220px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 50; animation: fadein .12s ease; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 440px; max-width: 92vw; max-height: 86vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 16px; font-size: 16px; }
  .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 20px; }
  .modal-actions .right { display: flex; gap: 8px; margin-left: auto; }
  .secret-box { font-family: var(--mono); background: var(--bg-alt); border: 1px solid var(--border); padding: 10px; border-radius: 7px; font-size: 12px; word-break: break-all; margin-top: 8px; color: var(--green); }
  .muted { color: var(--text-faint); font-size: 12px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border); padding: 12px 16px; border-radius: 9px; font-size: 13px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,0.3); animation: fadein .15s ease; }
  .toast.err { border-color: var(--red); color: var(--red); }
  .toast.ok { border-color: var(--green); color: var(--green); }
  .checkline { display: flex; align-items: center; gap: 9px; margin: 12px 0; font-size: 13px; }
  .checkline input { width: auto; }
  .divider { height: 1px; background: var(--border-soft); margin: 20px 0; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ---- account page specific ---- */
  .avatar-big-wrap { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
  .avatar-big { width: 74px; height: 74px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: var(--accent); cursor: pointer; position: relative; flex-shrink: 0; }
  .avatar-big:hover::after { content: 'Change'; position: absolute; inset: 0; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .theme-swatches { display: flex; gap: 10px; margin-top: 6px; }
  .swatch { width: 40px; height: 40px; border-radius: 9px; cursor: pointer; border: 2px solid transparent; position: relative; }
  .swatch.selected { border-color: var(--accent); }
  .swatch.ember { background: linear-gradient(135deg, #ff8a3d, #0b0e11); }
  .swatch.ocean { background: linear-gradient(135deg, #5fc4f5, #070f18); }
  .swatch.forest { background: linear-gradient(135deg, #7fe08b, #0a1209); }
  .swatch.light { background: linear-gradient(135deg, #d4661f, #eeebe4); }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; font-size: 13px; }
  .detail-grid .k { color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .detail-grid .v { color: var(--text); font-family: var(--mono); font-size: 12px; word-break: break-all; }

  /* ---- bulk toolbar / selection ---- */
  .bulk-bar { display: flex; align-items: center; gap: 10px; background: var(--accent-glow); border: 1px solid var(--accent-dim); border-radius: 8px; padding: 9px 14px; margin-bottom: 12px; font-size: 13px; }
  .bulk-bar .count { font-weight: 700; color: var(--accent); }
  .bulk-bar .spacer { flex: 1; }
  th.checkcol, td.checkcol { width: 30px; }

  /* ---- sessions list ---- */
  .session-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
  .session-row:last-child { border-bottom: none; }
  .session-row .info .app { font-weight: 700; }
  .session-row .info .meta { color: var(--text-faint); font-size: 11.5px; margin-top: 2px; }
  .empty-note { color: var(--text-faint); font-size: 13px; padding: 10px 0; }

  /* ---- filter bar ---- */
  .filter-bar { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-bar .fgroup { display: flex; flex-direction: column; gap: 4px; }
  .filter-bar .fgroup label { margin: 0; }
  .filter-bar input, .filter-bar select { padding: 8px 10px; font-size: 13px; width: auto; }

  /* ---- logo / import dropzone ---- */
  .logo-preview { width: 56px; height: 56px; border-radius: 10px; object-fit: contain; background: var(--bg-alt); border: 1px solid var(--border); padding: 6px; }
  .csv-drop { border: 2px dashed var(--border); border-radius: 9px; padding: 22px; text-align: center; cursor: pointer; color: var(--text-dim); font-size: 13px; }
  .csv-drop:hover { border-color: var(--accent-dim); color: var(--text); }
  .import-results-table { max-height: 240px; overflow-y: auto; margin-top: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

const ICONS = {
  dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  account: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-4 5-6 7.5-6s6 2 7.5 6"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M2.5 19c1-3.3 3.8-5 6.5-5s5.5 1.7 6.5 5"/><circle cx="17" cy="7" r="2.3"/><path d="M15.5 12.3c2 .2 3.8 1.8 4.5 4.2"/></svg>',
  apps: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
  activity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 5l3 3M13 8l2 2"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 000-2l2-1.5-2-3.5-2.4.5a8 8 0 00-1.7-1L15 3h-6l-.3 2.5a8 8 0 00-1.7 1l-2.4-.5-2 3.5L4.6 11a7.9 7.9 0 000 2l-2 1.5 2 3.5 2.4-.5a8 8 0 001.7 1L9 21h6l.3-2.5a8 8 0 001.7-1l2.4.5 2-3.5-2-1.5z"/></svg>',
  ranks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 10-4-2.5-7-5.5-7-10V6l7-3z"/></svg>',
  monitor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>',
};

const state = { profile: null, view: 'dashboard', branding: { siteName: 'GAM', logoExt: null }, ranks: [] };

async function api(path, opts = {}) {
  const isForm = opts.body instanceof FormData;
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: (opts.body && !isForm) ? { 'Content-Type': 'application/json' } : {},
    body: opts.body ? (isForm ? opts.body : JSON.stringify(opts.body)) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status})`);
  return data;
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme && ['ember','ocean','forest','light'].includes(theme) ? theme : 'ember');
}

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined) return;
    if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  });
  (children || []).forEach((c) => c && node.appendChild(c));
  return node;
}

function icon(name) { return el('span', { html: ICONS[name] || '' }); }

function initials(name) {
  return (name || '?').trim().charAt(0).toUpperCase();
}

function avatarNode(user, size) {
  const cls = size === 'big' ? 'avatar-big' : 'avatar-chip';
  if (user && user.avatarExt) {
    return el('img', { class: cls, src: `/avatars/${user.uid}.${user.avatarExt}?v=${Date.now()}`, alt: '' });
  }
  return el('div', { class: cls, text: initials(user ? user.username : '?') });
}

function brandmark() {
  if (state.branding.logoExt) {
    return el('div', { class: 'brandmark' }, [
      el('img', { class: 'logo', src: `/branding/logo.${state.branding.logoExt}?v=${state.brandingV || 0}`, alt: '' }),
      el('span', { class: 'word', text: state.branding.siteName }),
    ]);
  }
  const logo = `<svg class="logo" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
    <circle class="ring" cx="13" cy="13" r="10.5" fill="none" stroke-width="1.6" opacity=".5"/>
    <circle class="dot" cx="13" cy="4.2" r="2.6"/>
    <circle class="dot" cx="13" cy="13" r="3.4" opacity=".9"/>
  </svg>`;
  const name = state.branding.siteName || 'GAM';
  const wordHtml = name === 'GAM'
    ? 'G<span>A</span>M'
    : name.replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
  return el('div', { class: 'brandmark', html: `${logo}<span class="word">${wordHtml}</span>` });
}

/* ---------------- boot ---------------- */
async function boot() {
  applyTheme('ember');
  try {
    state.branding = await api('/branding');
  } catch (e) { /* fall back to default GAM branding */ }
  document.title = `${state.branding.siteName} — Global Admin Account System`;
  try {
    const { profile, requirePasswordChange } = await api('/session');
    state.profile = profile;
    applyTheme(profile.theme);
    if (requirePasswordChange) return renderForceChange();
    render();
  } catch (e) {
    renderLogin();
  }
}

/* ---------------- login ---------------- */
function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const errEl = el('div', { class: 'err' });
  const username = el('input', { type: 'text', autocomplete: 'username', placeholder: 'yourname' });
  const password = el('input', { type: 'password', autocomplete: 'current-password', placeholder: '••••••••' });

        method: 'POST', body: { username: username.value, password: password.value },

/* ---------------- shell ---------------- */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const caps = state.profile.capabilities || {};
  const tabs = [['dashboard', 'Dashboard', 'dashboard'], ['account', 'My Account', 'account']];
  if (caps.manageUsers) tabs.push(['users', 'Users', 'users']);
  if (caps.manageRanks) tabs.push(['ranks', 'Ranks', 'ranks']);
  if (caps.manageApps) tabs.push(['apps', 'Apps', 'apps']);
  if (caps.viewActivity) tabs.push(['activity', 'Activity', 'activity']);
  if (caps.manageBranding) tabs.push(['settings', 'Settings', 'settings']);

  const navEl = el('nav', {}, [
    el('div', { class: 'navlabel', text: 'Navigate' }),
    ...tabs.map(([id, label, ic]) =>
      el('button', {
        class: state.view === id ? 'active' : '',
        onclick: () => { state.view = id; render(); },
      }, [icon(ic), el('span', { text: label })])
    ),
  ]);

  const header = el('header', {}, [
    brandmark(),
    el('div', { class: 'who' }, [
      el('span', { class: 'role-pill ' + state.profile.role, text: state.profile.role }),
      avatarNode(state.profile, 'small'),
      el('span', { text: state.profile.username }),
      el('button', { class: 'btn-ghost btn-sm', text: 'Sign out', onclick: logout }),
    ]),
  ]);

  const content = el('section', { class: 'content', id: 'content' });
  app.appendChild(el('div', {}, [header, el('main', {}, [navEl, content])]));

  if (state.view === 'dashboard') renderDashboard(content);
  if (state.view === 'account') renderAccount(content);
  if (state.view === 'users') renderUsers(content);
  if (state.view === 'ranks') renderRanks(content);
  if (state.view === 'apps') renderApps(content);
  if (state.view === 'activity') renderActivity(content);
  if (state.view === 'settings') renderSettings(content);
}

function renderSessionsPanelLoading() {
  return el('div', { class: 'muted', text: 'Loading active sessions…' });
}

async function loadOwnSessions() {
  const panel = document.getElementById('sessions-panel');
  if (!panel) return;
  try {
    const sessions = await api('/account/sessions');
    if (!document.getElementById('sessions-panel')) return; // navigated away mid-fetch
    renderSessionsInto(panel, sessions, {
      onRevoke: async (tokenHash) => {
        await api('/account/sessions/' + tokenHash, { method: 'DELETE' });
        toast('Signed out of that session', 'ok');
        loadOwnSessions();
      },
      onRevokeAll: async () => {
        await api('/account/sessions/revoke-all', { method: 'POST' });
        toast('Signed out everywhere', 'ok');
        loadOwnSessions();
      },
    }, 'Apps you\u2019re currently signed into via GAM.');
  } catch (e) {
    panel.innerHTML = '';
    panel.appendChild(el('div', { class: 'err', text: 'Could not load sessions: ' + e.message }));
  }
}

function renderSessionsInto(panel, sessions, handlers, subtitle) {
  panel.innerHTML = '';
  const rows = sessions.length
    ? sessions.map((s) => el('div', { class: 'session-row' }, [
        el('div', { class: 'info' }, [
          el('div', { class: 'app', text: s.app_name }),
          el('div', { class: 'meta', text: `Last active ${new Date(s.last_seen_at).toLocaleString()} · expires ${new Date(s.expires_at).toLocaleDateString()}` }),
        ]),
        el('button', { class: 'btn-ghost btn-sm', text: 'Sign out', onclick: () => handlers.onRevoke(s.token_hash) }),
      ]))
    : [el('div', { class: 'empty-note', text: 'No active sessions in other apps right now.' })];

  panel.appendChild(el('h3', {}, [icon('monitor'), el('span', { text: 'Active sessions' })]));
  panel.appendChild(el('div', { class: 'muted', text: subtitle || 'Apps currently signed into via GAM.', style: 'margin-bottom:10px' }));
  rows.forEach((r) => panel.appendChild(r));
  if (sessions.length > 1) {
    panel.appendChild(el('button', { class: 'btn-ghost btn-sm', text: 'Sign out everywhere', style: 'margin-top:12px', onclick: handlers.onRevokeAll }));
  }
}

}

/* ---------------- users tab (manageUsers capability) ---------------- */
async function renderUsers(content) {
  const [users] = await Promise.all([api('/users'), ensureRanks()]);
  content.innerHTML = '';

  const selected = new Set();

  const bulkBar = el('div', { class: 'bulk-bar', style: 'display:none' });
  function updateBulkBar() {
    if (!selected.size) { bulkBar.style.display = 'none'; return; }
    bulkBar.style.display = 'flex';
    bulkBar.innerHTML = '';
    bulkBar.appendChild(el('span', {}, [el('span', { class: 'count', text: selected.size }), document.createTextNode(' selected')]));
    bulkBar.appendChild(el('div', { class: 'spacer' }));
    bulkBar.appendChild(el('button', { class: 'btn-ghost btn-sm', text: 'Enable', onclick: () => bulkPatch({ disabled: false }) }));
    bulkBar.appendChild(el('button', { class: 'btn-ghost btn-sm', text: 'Disable', onclick: () => bulkPatch({ disabled: true }) }));
    bulkBar.appendChild(el('button', { class: 'btn-danger btn-sm', text: 'Delete', onclick: bulkDelete }));
  }

  async function bulkPatch(body) {
    try {
      await Promise.all([...selected].map((uid) => api('/users/' + uid, { method: 'PATCH', body })));
      toast(`Updated ${selected.size} user${selected.size === 1 ? '' : 's'}`, 'ok');
      renderUsers(content);
    } catch (e) { toast(e.message, 'err'); }
  }
  async function bulkDelete() {
    if (!confirm(`Delete ${selected.size} selected user(s)? This cannot be undone.`)) return;
    try {
      await Promise.all([...selected].map((uid) => api('/users/' + uid, { method: 'DELETE' })));
      toast('Deleted', 'ok');
      renderUsers(content);
    } catch (e) { toast(e.message, 'err'); }
  }

  function makeRow(u) {
    const row = userRow(u);
    const cb = el('input', { type: 'checkbox' });
    cb.checked = selected.has(u.uid);
    cb.addEventListener('change', () => {
      if (cb.checked) selected.add(u.uid); else selected.delete(u.uid);
      updateBulkBar();
    });
    row.insertBefore(el('td', { class: 'checkcol' }, [cb]), row.firstChild);
    return row;
  }

  const search = el('input', { type: 'text', placeholder: 'Search username…' });
  const tbody = el('tbody', {}, users.map(makeRow));
  search.addEventListener('input', () => {
    const q = search.value.toLowerCase();
    tbody.innerHTML = '';
    users.filter((u) => u.username.toLowerCase().includes(q)).forEach((u) => tbody.appendChild(makeRow(u)));
  });

  const table = el('table', {}, [
    el('thead', {}, [el('tr', {}, [el('th', { class: 'checkcol' }), ...['User', 'Role', 'Status', ''].map((h) => el('th', { text: h }))])]),
    tbody,
  ]);
  content.appendChild(el('div', {}, [
    el('h2', {}, [icon('users'), el('span', { text: 'Users' })]),
    el('div', { class: 'pagesub', text: `${users.length} account${users.length === 1 ? '' : 's'} registered with GAM.` }),
    el('div', { class: 'toolbar' }, [
      search,
      el('div', { style: 'display:flex;gap:8px' }, [
        el('button', { class: 'btn-ghost', text: 'Import CSV', onclick: openImportCsvModal }),
        el('button', { class: 'btn-primary', text: '+ New user', onclick: () => openCreateUserModal() }),
      ]),
    ]),
    bulkBar,
    table,
  ]));
}

function rankRow(r, capabilities, canManage) {
  const capsText = capabilities.filter((c) => r.capabilities[c]).join(', ') || '—';
  const actions = [];
  if (canManage && !r.locked) {
    actions.push(el('button', { class: 'btn-ghost btn-sm', text: 'Edit', onclick: () => openRankModal(r, capabilities) }));
  }
  if (canManage && !r.isBuiltin) {
    actions.push(el('button', { class: 'btn-danger btn-sm', text: 'Delete', onclick: () => deleteRank(r) }));
  }
  return el('tr', {}, [
    el('td', {}, [el('span', { class: 'badge ' + r.name, text: r.label }), r.locked ? el('span', { class: 'hint', text: ' (fixed)' }) : null]),
    el('td', { text: capsText }),
    el('td', { class: 'row-actions' }, actions),
  ]);
}

async function deleteRank(r) {
  if (!confirm(`Delete the "${r.label}" rank? Any user still assigned to it must be reassigned first.`)) return;
  try {
    await api('/ranks/' + r.name, { method: 'DELETE' });
    toast('Rank deleted', 'ok');
    renderRanks(document.getElementById('content'));
  } catch (e) { toast(e.message, 'err'); }
}

function openRankModal(rank, capabilities) {
  const isNew = !rank;
  const name = el('input', { type: 'text', placeholder: 'e.g. supportLead', value: rank ? rank.name : '' });
  if (!isNew) name.disabled = true;
  const label = el('input', { type: 'text', placeholder: 'e.g. Support Lead', value: rank ? rank.label : '' });
  const checkboxes = {};
  const capList = capabilities.map((c) => {
    const cb = el('input', { type: 'checkbox' });
    cb.checked = !!(rank && rank.capabilities[c]);
    checkboxes[c] = cb;
    return el('label', { style: 'display:flex;align-items:center;gap:8px;font-weight:400;margin-bottom:6px' }, [cb, el('span', { text: c })]);
  });
  const errEl = el('div', { class: 'err' });

  async function submit() {
    errEl.textContent = '';
    const caps = {};
    capabilities.forEach((c) => { caps[c] = checkboxes[c].checked; });
    try {
      if (isNew) {
        await api('/ranks', { method: 'POST', body: { name: name.value, label: label.value, capabilities: caps } });
        toast('Rank created', 'ok');
      } else {
        await api('/ranks/' + rank.name, { method: 'PATCH', body: { label: label.value, capabilities: caps } });
        toast('Rank updated', 'ok');
      }
      closeModal();
      renderRanks(document.getElementById('content'));
    } catch (e) { errEl.textContent = e.message; }
  }

  openModal([
    el('h3', {}, [icon('ranks'), el('span', { text: isNew ? 'New rank' : 'Edit rank' })]),
    el('label', { text: 'Name (used internally, letters/numbers only)' }), name,
    el('label', { text: 'Label (shown in the UI)' }), label,
    el('label', { text: 'Capabilities' }),
    el('div', {}, capList),
    errEl,
    el('div', { class: 'modal-actions' }, [
      el('div', { class: 'right' }, [
        el('button', { class: 'btn-ghost', text: 'Cancel', onclick: closeModal }),
        el('button', { class: 'btn-primary', text: isNew ? 'Create' : 'Save', onclick: submit }),
      ]),
    ]),
  ]);
}

function openImportCsvModal() {
  const fileInput = el('input', { type: 'file', accept: '.csv,text/csv', style: 'display:none' });
  const dropzone = el('div', { class: 'csv-drop' }, [
    icon('upload'),
    el('div', { style: 'margin-top:8px', text: 'Click to choose a CSV file' }),
    el('div', { class: 'hint', text: 'Header row: username,role,fullName,description (role defaults to staff, fullName/description optional)' }),
  ]);
  dropzone.addEventListener('click', () => fileInput.click());
  const errEl = el('div', { class: 'err' });
  const resultsWrap = el('div', { class: 'import-results-table' });
  let parsedRows = [];
  let importedCreds = [];

  function parseCsv(text) {
    const lines = text.split(/\r?\n/).filter((l) => l.trim());
    if (!lines.length) return [];
    const header = lines[0].split(',').map((h) => h.trim().toLowerCase());
    return lines.slice(1).map((line) => {
      const cols = line.split(',').map((c) => c.trim());
      const row = {};
      header.forEach((h, i) => { row[h] = cols[i] || ''; });
      return row;
    });
  }
  function genPassword() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#%';
    let out = '';
    for (let i = 0; i < 14; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  fileInput.addEventListener('change', async () => {
    if (!fileInput.files[0]) return;
    const text = await fileInput.files[0].text();
    parsedRows = parseCsv(text).filter((r) => r.username);
    resultsWrap.innerHTML = '';
    resultsWrap.appendChild(el('table', {}, [
      el('thead', {}, [el('tr', {}, ['Username', 'Role'].map((h) => el('th', { text: h })))]),
      el('tbody', {}, parsedRows.map((r) => el('tr', {}, [
        el('td', { text: r.username }), el('td', { text: r.role || 'staff' }),
      ]))),
    ]));
    importBtn.disabled = false;
    importBtn.textContent = `Import ${parsedRows.length} user${parsedRows.length === 1 ? '' : 's'}`;
  });

  async function runImport() {
    errEl.textContent = '';
    importedCreds = [];
    const outcomes = [];
    for (const row of parsedRows) {
      const password = genPassword();
      try {
        await api('/users', { method: 'POST', body: { username: row.username, password, role: row.role || 'staff', fullName: row.fullname || row.fullName || '', description: row.description || '' } });
        importedCreds.push({ username: row.username, password });
        outcomes.push(`${row.username}: created`);
      } catch (e) {
        outcomes.push(`${row.username}: FAILED — ${e.message}`);
      }
    }
    resultsWrap.innerHTML = '';
    resultsWrap.appendChild(el('table', {}, [
      el('thead', {}, [el('tr', {}, ['Result'].map((h) => el('th', { text: h })))]),
      el('tbody', {}, outcomes.map((o) => el('tr', {}, [el('td', { text: o })]))),
    ]));
    if (importedCreds.length) {
      downloadBtn.style.display = 'inline-block';
      toast(`Imported ${importedCreds.length} user${importedCreds.length === 1 ? '' : 's'}`, 'ok');
    }
    importBtn.style.display = 'none';
    renderUsers(document.getElementById('content'));
  }

  function downloadCreds() {
    const csv = 'username,temporary_password\n' + importedCreds.map((c) => `${c.username},${c.password}`).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gus-imported-credentials.csv';
    a.click();
  }

  const importBtn = el('button', { class: 'btn-primary', text: 'Choose a file first', disabled: 'disabled', onclick: runImport });
  const downloadBtn = el('button', { class: 'btn-ghost', text: 'Download credentials CSV', style: 'display:none', onclick: downloadCreds });

  openModal([
    el('h3', {}, [icon('upload'), el('span', { text: 'Import users from CSV' })]),
    dropzone, fileInput,
    el('div', { class: 'hint', text: 'Every imported account gets a random temporary password and is forced to change it on first login, same as creating one by hand.' }),
    errEl,
    resultsWrap,
    el('div', { class: 'modal-actions' }, [
      downloadBtn,
      el('div', { class: 'right' }, [
        el('button', { class: 'btn-ghost', text: 'Close', onclick: closeModal }),
        importBtn,
      ]),
    ]),
  ]);
}

function openCreateUserModal() {
  const username = el('input', { type: 'text', placeholder: 'username' });
  const password = el('input', { type: 'password', placeholder: 'temporary password' });
  const confirmPw = el('input', { type: 'password', placeholder: 'confirm temporary password' });
  const fullName = el('input', { type: 'text', placeholder: 'optional' });
  const role = el('select', {}, state.ranks.map((r) => el('option', { value: r.name, text: r.label, selected: r.name === 'staff' ? 'selected' : null })));
  const errEl = el('div', { class: 'err' });

  function genPassword() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#%';
    let out = '';
    for (let i = 0; i < 14; i++) out += chars[Math.floor(Math.random() * chars.length)];
    password.value = out;
    password.type = 'text';
    confirmPw.value = out;
    confirmPw.type = 'text';
  }

  async function submit() {
    errEl.textContent = '';
    if (password.value !== confirmPw.value) { errEl.textContent = 'Passwords do not match.'; return; }
    try {
      await api('/users', { method: 'POST', body: { username: username.value, password: password.value, role: role.value, fullName: fullName.value } });
      closeModal();
      toast('User created — they will be required to change their password on first login', 'ok');
      renderUsers(document.getElementById('content'));
    } catch (e) { errEl.textContent = e.message; }
  }

  openModal([
    el('h3', {}, [icon('users'), el('span', { text: 'New user' })]),
    el('label', { text: 'Username' }), username,
    el('label', { text: 'Full name (optional)' }), fullName,
    el('label', { text: 'Temporary password' }), el('div', { style: 'display:flex;gap:8px' }, [password, el('button', { class: 'btn-ghost btn-sm', text: 'Generate', onclick: genPassword })]),
    el('label', { text: 'Confirm temporary password' }), confirmPw,
    el('div', { class: 'hint', text: 'At least 8 characters. They\u2019ll be forced to change it on first login, no matter what.' }),
    el('label', { text: 'Role' }), role,
    errEl,
    el('div', { class: 'modal-actions' }, [
      el('div', { class: 'right' }, [
        el('button', { class: 'btn-ghost', text: 'Cancel', onclick: closeModal }),
        el('button', { class: 'btn-primary', text: 'Create', onclick: submit }),
      ]),
    ]),
  ]);
}

function openManageUserModal(u) {
  const role = el('select', {}, state.ranks.map((r) => el('option', { value: r.name, text: r.label, selected: r.name === u.role ? 'selected' : null })));
  const fullName = el('input', { type: 'text', value: u.fullName || '' });
  const description = el('textarea', { rows: '2' }); description.value = u.description || '';
  const disabled = el('input', { type: 'checkbox' }); disabled.checked = u.disabled;

  const mustChange = el('input', { type: 'checkbox' }); mustChange.checked = !!u.mustChangePassword;
  const cannotChange = el('input', { type: 'checkbox' }); cannotChange.checked = !!u.cannotChangePassword;
  mustChange.addEventListener('change', () => { if (mustChange.checked) cannotChange.checked = false; });
  cannotChange.addEventListener('change', () => { if (cannotChange.checked) mustChange.checked = false; });

  const neverExpires = el('input', { type: 'checkbox' }); neverExpires.checked = u.passwordNeverExpires !== false;
  const expiresAt = el('input', { type: 'date', value: u.passwordExpiresAt ? u.passwordExpiresAt.slice(0, 10) : '' });
  expiresAt.disabled = neverExpires.checked;
  neverExpires.addEventListener('change', () => { expiresAt.disabled = neverExpires.checked; });

  const newPw = el('input', { type: 'password', placeholder: 'Leave blank to keep current password' });
  const confirmNewPw = el('input', { type: 'password', placeholder: 'Confirm new password' });
  const errEl = el('div', { class: 'err' });

  async function save() {
    errEl.textContent = '';
    if (newPw.value && newPw.value !== confirmNewPw.value) {
      errEl.textContent = 'New password and confirmation do not match.';
      return;
    }
    try {
      const body = {
        role: role.value, disabled: disabled.checked, fullName: fullName.value, description: description.value,
        mustChangePassword: mustChange.checked, cannotChangePassword: cannotChange.checked,
        passwordNeverExpires: neverExpires.checked,
        passwordExpiresAt: neverExpires.checked ? null : (expiresAt.value ? new Date(expiresAt.value).toISOString() : null),
      };
      if (newPw.value) { body.password = newPw.value; body.confirmPassword = confirmNewPw.value; }
      await api('/users/' + u.uid, { method: 'PATCH', body });
      closeModal();
      toast('Updated', 'ok');
      renderUsers(document.getElementById('content'));
    } catch (e) { errEl.textContent = e.message; }
  }
  async function del() {
    if (!confirm('Delete "' + u.username + '"? This cannot be undone.')) return;
    try {
      await api('/users/' + u.uid, { method: 'DELETE' });
      closeModal();
      toast('Deleted', 'ok');
      renderUsers(document.getElementById('content'));
    } catch (e) { errEl.textContent = e.message; }
  }

  openModal([
    el('h3', {}, [avatarNode(u, 'small'), el('span', { text: 'Manage ' + u.username })]),
    el('div', { class: 'field-row' }, [
      el('div', {}, [el('label', { text: 'Full name' }), fullName]),
      el('div', {}, [el('label', { text: 'Role' }), role]),
    ]),
    el('label', { text: 'Description' }), description,
    el('div', { class: 'checkline' }, [disabled, el('span', { text: 'Account disabled' })]),

    el('div', { class: 'divider' }),
    el('div', { class: 'muted', text: 'PASSWORD POLICY' }),
    el('div', { class: 'checkline' }, [mustChange, el('span', { text: 'Force password change on next login' })]),
    el('div', { class: 'checkline' }, [cannotChange, el('span', { text: 'User cannot change their own password' })]),
    el('div', { class: 'checkline' }, [neverExpires, el('span', { text: 'Password never expires' })]),
    el('label', { text: 'Expires on', style: 'margin-top:4px' }), expiresAt,

    el('div', { class: 'divider' }),
    el('label', { text: 'Reset password' }), newPw,
    el('label', { text: 'Confirm new password' }), confirmNewPw,
    errEl,

    el('div', { class: 'divider' }),
    el('div', { id: 'manage-user-sessions' }, [el('div', { class: 'muted', text: 'Loading active sessions…' })]),

    el('div', { class: 'modal-actions' }, [
      el('button', { class: 'btn-danger', text: 'Delete user', onclick: del }),
      el('div', { class: 'right' }, [
        el('button', { class: 'btn-ghost', text: 'Cancel', onclick: closeModal }),
        el('button', { class: 'btn-primary', text: 'Save', onclick: save }),
      ]),
    ]),
  ]);

  loadUserSessions(u.uid);
}

async function loadUserSessions(uid) {
  const wrap = document.getElementById('manage-user-sessions');
  if (!wrap) return;
  try {
    const sessions = await api('/users/' + uid + '/sessions');
    if (!document.getElementById('manage-user-sessions')) return; // modal closed mid-fetch
    renderSessionsInto(wrap, sessions, {
      onRevoke: async (tokenHash) => {
        await api('/users/' + uid + '/sessions/' + tokenHash, { method: 'DELETE' });
        toast('Signed out of that session', 'ok');
        loadUserSessions(uid);
      },
      onRevokeAll: async () => {
        await api('/users/' + uid + '/sessions/revoke-all', { method: 'POST' });
        toast('Signed out everywhere', 'ok');
        loadUserSessions(uid);
      },
    }, 'Apps this user is currently signed into via GAM.');
  } catch (e) {
    wrap.innerHTML = '';
    wrap.appendChild(el('div', { class: 'err', text: 'Could not load sessions: ' + e.message }));
  }
}

/**
 * Per-user access overrides for one app — the accounts a sysadmin has
 * specifically blocked from this app without disabling the app itself.
 * Listing candidate users to block needs the manageUsers capability too;
 * a manageApps-only rank can still see and lift existing blocks.
 */
async function openAppAccessModal(a) {
  const listWrap = el('div', {});
  const errEl = el('div', { class: 'err' });
  openModal([
    el('h3', {}, [icon('apps'), el('span', { text: '"' + a.name + '" access' })]),
    el('div', { class: 'hint', text: 'Users blocked here can’t sign into this app even though their account is otherwise fine — /api/v1/login returns "good-no-access" for them.' }),
    listWrap,
    errEl,
    el('div', { class: 'modal-actions' }, [
      el('div', { class: 'right' }, [el('button', { class: 'btn-ghost', text: 'Close', onclick: closeModal })]),
    ]),
  ]);

  async function refresh() {
    listWrap.innerHTML = 'Loading…';
    try {
      const [{ blocked }, users] = await Promise.all([
        api(`/apps/${a.appId}/access`),
        api('/users').catch(() => null),
      ]);
      listWrap.innerHTML = '';
      const blockedUids = new Set(blocked.map((b) => b.uid));

      if (blocked.length) {
        listWrap.appendChild(el('div', { class: 'hint', text: 'Currently blocked:' }));
        blocked.forEach((b) => {
          listWrap.appendChild(el('div', { class: 'name-cell', style: 'margin:6px 0' }, [
            el('span', { text: b.username, style: 'flex:1' }),
            el('button', { class: 'btn-ghost btn-sm', text: 'Unblock', onclick: async () => {
              try { await api(`/apps/${a.appId}/access/${b.uid}/unblock`, { method: 'POST' }); refresh(); }
              catch (e) { errEl.textContent = e.message; }
            } }),
          ]));
        });
      } else {
        listWrap.appendChild(el('div', { class: 'muted', text: 'No users are blocked from this app.' }));
      }

      if (users) {
        const candidates = users.filter((u) => !blockedUids.has(u.uid));
        if (candidates.length) {
          const select = el('select', {}, candidates.map((u) => el('option', { value: u.uid, text: u.username })));
          const blockBtn = el('button', { class: 'btn-danger btn-sm', text: 'Block', onclick: async () => {
            try { await api(`/apps/${a.appId}/access/${select.value}/block`, { method: 'POST' }); refresh(); }
            catch (e) { errEl.textContent = e.message; }
          } });
          listWrap.appendChild(el('div', { class: 'divider' }));
          listWrap.appendChild(el('div', { style: 'display:flex;gap:8px' }, [select, blockBtn]));
        }
      }
    } catch (e) {
      listWrap.innerHTML = '';
      errEl.textContent = e.message;
    }
  }

  refresh();
}

function renderSecretModal(app, secret) {
  function copy(text) { navigator.clipboard && navigator.clipboard.writeText(text); toast('Copied', 'ok'); }

/* ---------------- activity tab (viewActivity capability) ---------------- */
async function renderActivity(content) {
  const categories = await api('/activity/categories');
  content.innerHTML = '';

  const categorySelect = el('select', {}, [
    el('option', { value: '', text: 'All categories' }),
    ...categories.map((c) => el('option', { value: c, text: c })),
  ]);
  const actorInput = el('input', { type: 'text', placeholder: 'e.g. aledeaux' });
  const fromInput = el('input', { type: 'date' });
  const toInput = el('input', { type: 'date' });
  const activityTableWrap = el('div', {});

  function buildQuery(extra) {
    const params = new URLSearchParams();
    if (categorySelect.value) params.set('category', categorySelect.value);
    if (actorInput.value) params.set('actor', actorInput.value);
    if (fromInput.value) params.set('from', new Date(fromInput.value).toISOString());
    if (toInput.value) params.set('to', new Date(toInput.value + 'T23:59:59').toISOString());
    Object.entries(extra || {}).forEach(([k, v]) => params.set(k, v));
    return params.toString();
  }

  async function applyFilters() {
    const activity = await api('/activity?' + buildQuery());
    activityTableWrap.innerHTML = '';
    activityTableWrap.appendChild(el('table', {}, [
      el('thead', {}, [el('tr', {}, ['When', 'Category', 'Actor', 'Message'].map((h) => el('th', { text: h })))]),
      el('tbody', {}, activity.length ? activity.map((a) => el('tr', {}, [
        el('td', { style: 'width:150px', text: new Date(a.created_at).toLocaleString() }),
        el('td', {}, [el('span', { class: 'badge', text: a.category })]),
        el('td', { text: a.actor_username || '\u2014' }),
        el('td', { text: a.message }),
      ])) : [el('tr', {}, [el('td', { colspan: '4', class: 'empty-note', text: 'No activity matches these filters.' })])]),
    ]));
  }

  function exportCsv() {
    window.open('/api/activity/export?' + buildQuery(), '_blank');
  }

  [categorySelect, actorInput, fromInput, toInput].forEach((el2) => el2.addEventListener('change', applyFilters));
  actorInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyFilters(); });

  const [, failedLogins] = await Promise.all([applyFilters(), api('/failed-logins')]);

  content.appendChild(el('div', {}, [
    el('h2', {}, [icon('activity'), el('span', { text: 'Activity' })]),
    el('div', { class: 'pagesub', text: 'What\u2019s happened across GAM recently.' }),

    el('div', { class: 'filter-bar' }, [
      el('div', { class: 'fgroup' }, [el('label', { text: 'Category' }), categorySelect]),
      el('div', { class: 'fgroup' }, [el('label', { text: 'Actor' }), actorInput]),
      el('div', { class: 'fgroup' }, [el('label', { text: 'From' }), fromInput]),
      el('div', { class: 'fgroup' }, [el('label', { text: 'To' }), toInput]),
      el('button', { class: 'btn-ghost', text: 'Apply', onclick: applyFilters }),
      el('button', { class: 'btn-ghost', text: 'Export CSV', onclick: exportCsv }, [icon('download')]),
    ]),

    el('div', { class: 'panel' }, [activityTableWrap]),

    el('h2', { style: 'margin-top:8px' }, [icon('key'), el('span', { text: 'Failed sign-ins' })]),
    el('div', { class: 'panel' }, [
      el('table', {}, [
        el('thead', {}, [el('tr', {}, ['When', 'Username', 'IP', 'Reason'].map((h) => el('th', { text: h })))]),
        el('tbody', {}, failedLogins.map((f) => el('tr', {}, [
          el('td', { style: 'width:150px', text: new Date(f.created_at).toLocaleString() }),
          el('td', { text: f.username || '\u2014' }),
          el('td', { text: f.ip || '\u2014' }),
          el('td', {}, [el('span', { class: 'badge ' + (f.reason === 'disabled' ? 'disabled' : 'warn'), text: f.reason || '\u2014' })]),
        ]))),
      ]),
    ]),
  ]));
}

    el('div', { class: 'pagesub', text: 'Branding shown on the login screen and header, for every app connected to GAM.' }),

    el('div', { class: 'panel' }, [
      el('h3', {}, [icon('account'), el('span', { text: 'Site name' })]),
      siteName,
      el('button', { class: 'btn-primary', text: 'Save', style: 'margin-top:14px', onclick: saveName }),
    ]),

    el('div', { class: 'panel' }, [
      el('h3', {}, [icon('upload'), el('span', { text: 'Logo' })]),
      el('div', { style: 'display:flex;align-items:center;gap:16px' }, [
        logoPreview,
        el('div', {}, [
          el('button', { class: 'btn-ghost btn-sm', text: branding.logoExt ? 'Replace logo' : 'Upload logo', onclick: () => logoFile.click() }),
          branding.logoExt ? el('button', { class: 'btn-ghost btn-sm', text: 'Remove', style: 'margin-left:8px', onclick: removeLogo }) : null,
        ]),
      ]),
      logoFile,
      el('div', { class: 'hint', text: 'PNG, JPEG, WEBP, or SVG, up to 1MB. Falls back to the default GAM mark if not set.' }),
    ]),
  ]));
}

/* ---------------- modal helper ---------------- */
function openModal(children) {
  closeModal();
  const backdrop = el('div', { class: 'modal-backdrop', id: 'modal-backdrop' }, [el('div', { class: 'modal' }, children)]);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
  document.body.appendChild(backdrop);
}
function closeModal() {
  const existing = document.getElementById('modal-backdrop');
  if (existing) existing.remove();
}

boot();
</script>
</body>
